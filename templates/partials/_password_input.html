{% load i18n %}
{% get_current_language as CURRENT_LANG %}
<div class="password-input-wrapper">
    {{ field }}
    <button type="button"
            class="password-visibility-toggle"
            data-password-toggle="{{ field.id_for_label }}"
            data-show-label="{% if CURRENT_LANG == 'en' %}Show password{% else %}Afficher le mot de passe{% endif %}"
            data-hide-label="{% if CURRENT_LANG == 'en' %}Hide password{% else %}Masquer le mot de passe{% endif %}"
            aria-label="{% if CURRENT_LANG == 'en' %}Show password{% else %}Afficher le mot de passe{% endif %}"
            aria-controls="{{ field.id_for_label }}"
            aria-pressed="false">
        <i class="bi bi-eye" aria-hidden="true"></i>
    </button>
</div>
